name: Needle2 Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle configuration
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/needle2-release.jks" \
            -storepass "needle2-build" \
            -keypass "needle2-build" \
            -alias "needle2" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Needle2, OU=Aaditya Labs, O=Aaditya Labs, L=Kota, ST=Rajasthan, C=IN"

      - name: Sign release APK
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/needle2-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/needle2-release.jks" \
            --ks-pass pass:needle2-build \
            --key-pass pass:needle2-build \
            --ks-key-alias needle2 \
            --out "$signed" "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$signed"

      - name: Test portable Rust core
        run: cargo test -p needle2-mobile-core

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Android libraries
        run: |
          cargo ndk -t arm64-v8a -t x86_64 build -p needle2-mobile-core --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: needle2-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/needle2-release.apk

      - name: Publish latest APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="needle2-latest"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              app/build/outputs/apk/release/needle2-release.apk \
              app/build/outputs/apk/debug/app-debug.apk \
              --clobber
          else
            gh release create "$tag" \
              app/build/outputs/apk/release/needle2-release.apk \
              app/build/outputs/apk/debug/app-debug.apk \
              --title "Needle2 Latest Android APK" \
              --notes "Latest automated Needle2 Android build from main."
          fi
