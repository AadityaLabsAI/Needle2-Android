name: Build and Release Needle 2 Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Needle 2 model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            'https://huggingface.co/Cactus-Compute/needle2/resolve/b739205bcda01f71ebf0ba180f75a885d515ad96/needle2.cact?download=true' \
            -o app/src/main/assets/needle2.cact
          echo 'b43aabfcaf1a6db6acf488076eab71d823c08697c7af4521fc1d174b60ede5ba  app/src/main/assets/needle2.cact' | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'

      - name: Install Gradle 8.7
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature, package and offline playground assets
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          echo "Found APK: $APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -l "$APK_PATH" | grep -E 'assets/(needle2\.cact|playground/index\.html)' 
          unzip -l "$APK_PATH" | grep 'lib/arm64-v8a/libneedle2_jni.so'
          unzip -l "$APK_PATH" | grep 'lib/arm64-v8a/libc++_shared.so'
          mkdir -p release
          cp "$APK_PATH" release/Needle2-Android-v1.1.0-arm64-signed.apk
          sha256sum release/Needle2-Android-v1.1.0-arm64-signed.apk
          ls -lh release/Needle2-Android-v1.1.0-arm64-signed.apk

      - name: Prepare install package ZIP
        run: |
          mkdir -p package/Needle2-Android-v1.1.0
          cp release/Needle2-Android-v1.1.0-arm64-signed.apk package/Needle2-Android-v1.1.0/base.apk
          printf '%s\n' \
            'Needle 2 Android v1.1.0' \
            'Signed ARM64 base APK for Android 9+.' \
            'Offline Chrome playground is bundled.' \
            'Install base.apk after extracting this ZIP.' \
            > package/Needle2-Android-v1.1.0/README.txt
          cd package && zip -qr ../Needle2-Android-v1.1.0-arm64-package.zip Needle2-Android-v1.1.0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Needle 2 Android v1.1.0
          body: |
            Crash-isolated offline playground build.

            - Official Cactus Needle 2 engine and model
            - Fully local inference
            - Android 9+
            - arm64-v8a
            - Main UI no longer loads native engine during startup
            - Native engine runs in a separate Android process
            - Offline localhost playground for Chrome
            - Playground instructions included in the app
            - No Termux or Python required
            - Signed APK verified with apksigner
          files: |
            release/Needle2-Android-v1.1.0-arm64-signed.apk
            Needle2-Android-v1.1.0-arm64-package.zip
          make_latest: true
          prerelease: false
