name: Build and Release Needle 2 Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Needle 2 model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 3 'https://huggingface.co/Cactus-Compute/needle2/resolve/b739205bcda01f71ebf0ba180f75a885d515ad96/needle2.cact?download=true' -o app/src/main/assets/needle2.cact
          echo 'b43aabfcaf1a6db6acf488076eab71d823c08697c7af4521fc1d174b60ede5ba  app/src/main/assets/needle2.cact' | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'

      - name: Install Gradle 8.7
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.7/bin' >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and package contents
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          echo "APK: $APK_PATH"

          echo '--- Android APK signature verification ---'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$APK_PATH"
          echo 'Signature verification passed.'

          echo '--- ZIP integrity ---'
          unzip -t "$APK_PATH" >/dev/null

          ZIP_LIST=$(mktemp)
          unzip -Z1 "$APK_PATH" > "$ZIP_LIST"
          grep -qx 'assets/needle2.cact' "$ZIP_LIST"
          grep -qx 'assets/playground/index.html' "$ZIP_LIST"
          grep -qx 'lib/arm64-v8a/libneedle2_jni.so' "$ZIP_LIST"
          grep -qx 'lib/arm64-v8a/libc++_shared.so' "$ZIP_LIST"
          grep -qx 'res/xml/accessibility_service_config.xml' "$ZIP_LIST"
          echo 'Required model, web console, native runtime and accessibility service are present.'

          mkdir -p release
          cp "$APK_PATH" release/Needle2-Android-v1.3.1-arm64-signed.apk
          sha256sum release/Needle2-Android-v1.3.1-arm64-signed.apk | tee release/Needle2-Android-v1.3.1-arm64-signed.apk.sha256

      - name: Prepare install package
        run: |
          set -euo pipefail
          mkdir -p package
          cp release/Needle2-Android-v1.3.1-arm64-signed.apk package/base.apk
          cp release/Needle2-Android-v1.3.1-arm64-signed.apk.sha256 package/base.apk.sha256
          cat > package/README.txt <<'EOF'
Needle 2 Android v1.3.1

ARM64 Android 9+.
Install base.apk, open Needle 2 Local AI, enable Device Automation in Android Accessibility settings, then open the local Playground in Chrome.

Needle 2 model and native inference runtime are bundled in the APK. No cloud AI API or model download is required at runtime.
EOF
          cd package
          zip -q ../release/Needle2-Android-v1.3.1-arm64-package.zip base.apk base.apk.sha256 README.txt
          cd ..
          sha256sum release/Needle2-Android-v1.3.1-arm64-package.zip | tee release/Needle2-Android-v1.3.1-arm64-package.zip.sha256

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Needle2-Android-v1.3.1-arm64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Needle 2 Android v1.3.1
          generate_release_notes: true
          files: |
            release/Needle2-Android-v1.3.1-arm64-signed.apk
            release/Needle2-Android-v1.3.1-arm64-signed.apk.sha256
            release/Needle2-Android-v1.3.1-arm64-package.zip
            release/Needle2-Android-v1.3.1-arm64-package.zip.sha256
