name: Needle2 Core CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/mobile-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/CI.yml"
  pull_request:
    paths:
      - "crates/mobile-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/CI.yml"

permissions:
  contents: read

jobs:
  mobile-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test mobile core
        run: cargo test -p needle2-mobile-core
      - name: Format mobile core
        run: cargo fmt --all -- --check
