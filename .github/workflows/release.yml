name: Needle 2 Android Final Release

on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download official Needle 2 browser runtime and model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/runtime
          base='https://huggingface.co/Cactus-Compute/needle2/resolve/main'
          curl -fL --retry 5 "$base/wasm/needle.js?download=true" -o app/src/main/assets/runtime/needle.js
          curl -fL --retry 5 "$base/wasm/needle.wasm?download=true" -o app/src/main/assets/runtime/needle.wasm
          curl -fL --retry 5 "$base/needle2.cact?download=true" -o app/src/main/assets/runtime/needle2.cact
          echo 'b43aabfcaf1a6db6acf488076eab71d823c08697c7af4521fc1d174b60ede5ba  app/src/main/assets/runtime/needle2.cact' | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install Android SDK and Android 9 test image robustly
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --update || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'platforms;android-28' 'system-images;android-28;default;x86_64'
          test -f "$HOME/.android/debug.keystore"
      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.7/bin' >> "$GITHUB_PATH"
      - name: Build final release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK before device test
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" > /tmp/files
          for f in assets/playground/index.html assets/runtime/needle.js assets/runtime/needle.wasm assets/runtime/needle2.cact; do grep -Fqx "$f" /tmp/files; done
          ! grep -q '^lib/' /tmp/files
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$apk" | tee /tmp/signature.txt
          grep -Fq 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | tee /tmp/badging.txt
          grep -Fq "package: name='com.aadityasamriya.needle2.localagent'" /tmp/badging.txt
          grep -Fq "sdkVersion:'28'" /tmp/badging.txt
          grep -Fq "versionName='3.0.0'" /tmp/badging.txt
      - name: Android 9 clean install and launch test
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n needle-api28 -k 'system-images;android-28;default;x86_64' --device 'pixel_2' --force
          adb start-server
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          emulator -avd needle-api28 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() { adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          timeout 150s adb wait-for-device
          booted=''
          for i in $(seq 1 150); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = '1' ] && break
            sleep 2
          done
          [ "$booted" = '1' ] || { tail -n 200 /tmp/emulator.log; exit 1; }
          adb install "$apk" | tee /tmp/install.log
          grep -Fq 'Success' /tmp/install.log
          adb shell pm path com.aadityasamriya.needle2.localagent
          adb shell am force-stop com.aadityasamriya.needle2.localagent
          adb shell monkey -p com.aadityasamriya.needle2.localagent 1 | tee /tmp/launch.log
          sleep 7
          pid=$(adb shell pidof com.aadityasamriya.needle2.localagent | tr -d '\r')
          test -n "$pid"
          adb shell dumpsys package com.aadityasamriya.needle2.localagent | grep -F 'versionName=3.0.0'
      - name: Package final verified artifacts
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          mkdir -p release package
          cp "$apk" release/Needle2-Android-FINAL-Android9.apk
          sha256sum release/Needle2-Android-FINAL-Android9.apk | tee release/Needle2-Android-FINAL-Android9.apk.sha256
          cp release/Needle2-Android-FINAL-Android9.apk package/base.apk
          cp release/Needle2-Android-FINAL-Android9.apk.sha256 package/base.apk.sha256
          printf '%s\n' 'Needle 2 Android — Final Local Browser Edition' '' 'Install the APK, enable Needle 2 Device Automation, then open the Local Agent in Chrome.' '' 'Needle 2 inference runs locally in browser WebAssembly. No Termux, Python, cloud API, or Android native Needle runtime is required.' > package/README.txt
          (cd package && zip -q ../release/Needle2-Android-FINAL-package.zip base.apk base.apk.sha256 README.txt)
          sha256sum release/Needle2-Android-FINAL-package.zip | tee release/Needle2-Android-FINAL-package.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Needle2-Android-FINAL-verified
          path: release/*
          if-no-files-found: error
      - name: Publish final release only after all tests pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v3.0.0 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v3.0.0 release/* --repo "$GITHUB_REPOSITORY" --title 'Needle 2 Android — Final Local Browser Edition' --notes 'Final build passed APK integrity/signing verification and clean Android 9 install + launch testing.'
