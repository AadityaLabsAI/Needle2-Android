name: Needle 2 Android Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 'https://huggingface.co/Cactus-Compute/needle2/resolve/b739205bcda01f71ebf0ba180f75a885d515ad96/needle2.cact?download=true' -o app/src/main/assets/needle2.cact
          echo 'b43aabfcaf1a6db6acf488076eab71d823c08697c7af4521fc1d174b60ede5ba  app/src/main/assets/needle2.cact' | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'

      - name: Gradle
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.7/bin' >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          out=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$apk" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" > /tmp/files
          grep -qx 'assets/needle2.cact' /tmp/files
          grep -qx 'assets/playground/index.html' /tmp/files
          grep -qx 'lib/arm64-v8a/libneedle2_jni.so' /tmp/files
          grep -qx 'lib/arm64-v8a/libc++_shared.so' /tmp/files
          grep -qx 'res/xml/accessibility_service_config.xml' /tmp/files
          mkdir -p release
          cp "$apk" release/Needle2-Android-v1.3.2-arm64-signed.apk
          sha256sum release/Needle2-Android-v1.3.2-arm64-signed.apk | tee release/Needle2-Android-v1.3.2-arm64-signed.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Needle2-Android-v1.3.2-arm64
          path: release/*
          if-no-files-found: error
