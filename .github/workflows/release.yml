name: Needle 2 Android Release

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download browser runtime and model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/runtime
          base='https://huggingface.co/Cactus-Compute/needle2/resolve/main'
          curl -fL --retry 5 "$base/wasm/needle.js?download=true" -o app/src/main/assets/runtime/needle.js
          curl -fL --retry 5 "$base/wasm/needle.wasm?download=true" -o app/src/main/assets/runtime/needle.wasm
          curl -fL --retry 5 "$base/needle2.cact?download=true" -o app/src/main/assets/runtime/needle2.cact
          echo 'b43aabfcaf1a6db6acf488076eab71d823c08697c7af4521fc1d174b60ede5ba  app/src/main/assets/runtime/needle2.cact' | sha256sum -c -
          test -s app/src/main/assets/runtime/needle.js
          test -s app/src/main/assets/runtime/needle.wasm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
      - name: Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'platforms;android-28' 'system-images;android-28;google_apis;x86_64'
      - name: Gradle
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.7/bin' >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and test real Android 9 install
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          signature_output=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 28 "$apk" 2>&1 || true)
          printf '%s\n' "$signature_output"
          case "$signature_output" in
            *'Verified using v2 scheme (APK Signature Scheme v2): true'*) echo 'APK Signature Scheme v2 verified.' ;;
            *) echo 'ERROR: v2 APK signature verification failed.'; exit 1 ;;
          esac
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" > /tmp/files
          grep -Fqx 'assets/playground/index.html' /tmp/files
          grep -Fqx 'assets/runtime/needle.js' /tmp/files
          grep -Fqx 'assets/runtime/needle.wasm' /tmp/files
          grep -Fqx 'assets/runtime/needle2.cact' /tmp/files
          if grep -q '^lib/' /tmp/files; then echo 'ERROR: Native libraries must not be packaged.'; exit 1; fi
          echo 'APK structure verified.'
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n needle-api28 -k 'system-images;android-28;google_apis;x86_64' --device 'pixel_2' --force
          test -f "$ANDROID_AVD_HOME/needle-api28.ini"
          test -d "$ANDROID_AVD_HOME/needle-api28.avd"
          adb start-server
          emulator -avd needle-api28 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() { adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if ! timeout 60s adb wait-for-device; then
            echo 'ERROR: Android 9 emulator did not become available.'
            tail -n 120 /tmp/emulator.log || true
            exit 1
          fi
          booted=''
          for i in $(seq 1 90); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = '1' ] && break
            sleep 2
          done
          if [ "$booted" != '1' ]; then
            echo 'ERROR: Android 9 emulator did not finish booting.'
            tail -n 120 /tmp/emulator.log || true
            adb shell getprop 2>/dev/null | tail -n 40 || true
            exit 1
          fi
          adb install -r "$apk"
          adb shell pm path com.aadityasamriya.needle2.localagent
          adb shell monkey -p com.aadityasamriya.needle2.localagent 1 >/dev/null
          echo 'REAL ANDROID 9 EMULATOR INSTALL + LAUNCH PASSED.'
          mkdir -p release package
          cp "$apk" release/Needle2-Android-v2.1.0-arm64-signed.apk
          sha256sum release/Needle2-Android-v2.1.0-arm64-signed.apk | tee release/Needle2-Android-v2.1.0-arm64-signed.apk.sha256
          cp release/Needle2-Android-v2.1.0-arm64-signed.apk package/base.apk
          cp release/Needle2-Android-v2.1.0-arm64-signed.apk.sha256 package/base.apk.sha256
          printf '%s\n' 'Needle 2 Android v2.1.0' '' 'Android 9+.' 'Install the APK, open Needle 2 Local AI, enable Device Automation, then open the Local Agent in Chrome.' '' 'Needle 2 inference runs in browser WebAssembly. The APK contains the localhost bridge, accessibility service, UI, browser engine and model. No Termux, Python, cloud API, or Android native Needle runtime is required.' > package/README.txt
          (cd package && zip -q ../release/Needle2-Android-v2.1.0-arm64-package.zip base.apk base.apk.sha256 README.txt)
          sha256sum release/Needle2-Android-v2.1.0-arm64-package.zip | tee release/Needle2-Android-v2.1.0-arm64-package.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Needle2-Android-v2.1.0-browser-local
          path: release/*
          if-no-files-found: error
      - name: Publish release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v2.1.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create v2.1.0 release/* --repo "$GITHUB_REPOSITORY" --title 'Needle 2 Android v2.1.0 — Verified Android 9 Install' --generate-notes
