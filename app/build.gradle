plugins { id 'com.android.application' }

android {
    namespace 'com.aadityasamriya.needle2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aadityasamriya.needle2'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        ndkVersion '27.2.12479018'

        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use Android's standard debug signing key for this personal/local app.
            // This guarantees the APK is actually signed and installable without
            // requiring the user to configure a private release keystore.
            signingConfig signingConfigs.debug
        }
        debug { minifyEnabled false }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' }
    }
}
