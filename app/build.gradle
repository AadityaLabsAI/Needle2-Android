plugins { id 'com.android.application' }

android {
    namespace 'com.aadityasamriya.needle2'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aadityasamriya.needle2.localagent'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug { minifyEnabled false }
    }
}
